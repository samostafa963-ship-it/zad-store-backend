<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>زورا - لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#D100BC;--primary-dark:#8a007a;--primary-light:#fce8f9;
  --green:#4caf50;--red:#f44336;--orange:#ff9800;--blue:#2196f3;
  --bg:#f5f0fc;--white:#fff;--text:#2d2d2d;--gray:#888;--border:#edd8f5;
  --sidebar:#0f0a12
}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--sidebar);color:white;display:flex;flex-direction:column;position:fixed;height:100vh;z-index:100;overflow:hidden}
.logo{padding:22px 18px;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;gap:12px}
.logo-icon{width:40px;height:40px;background:var(--primary);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.logo h2{font-size:20px;font-weight:900;color:#fff}
.logo p{font-size:10px;color:rgba(255,255,255,0.4)}
.nav{flex:1;padding:12px 0;overflow-y:auto}
.nav-section{font-size:10px;color:rgba(255,255,255,0.3);padding:10px 18px 4px;font-weight:700;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 18px;cursor:pointer;transition:all 0.2s;border-right:3px solid transparent;color:rgba(255,255,255,0.5);font-size:13px;font-weight:600}
.nav-item:hover{background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.85)}
.nav-item.active{background:rgba(209,0,188,0.15);color:var(--primary);border-right-color:var(--primary)}
.main{margin-right:240px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--white);padding:14px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;gap:12px}
.page-title{font-size:19px;font-weight:900}
.topbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.content{padding:22px 28px;flex:1}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.stat-card{background:var(--white);border-radius:14px;padding:18px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 8px rgba(209,0,188,0.06);border:1px solid var(--border)}
.stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.stat-info h3{font-size:22px;font-weight:900;line-height:1}
.stat-info p{font-size:11px;color:var(--gray);margin-top:3px}
.card{background:var(--white);border-radius:14px;box-shadow:0 1px 8px rgba(209,0,188,0.06);border:1px solid var(--border);overflow:hidden;margin-bottom:16px}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;cursor:pointer;user-select:none}
.card-header h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-header .toggle{font-size:18px;color:var(--gray);transition:transform 0.2s}
.card-header.collapsed .toggle{transform:rotate(-90deg)}
.card-body{overflow:hidden;transition:max-height 0.3s ease}
table{width:100%;border-collapse:collapse}
th{background:var(--bg);padding:10px 12px;text-align:right;font-size:11px;color:var(--gray);font-weight:700;border-bottom:1px solid var(--border)}
td{padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fdf5fc}
.timg{width:38px;height:38px;border-radius:8px;object-fit:cover;background:var(--bg);cursor:pointer;border:2px solid transparent;transition:border-color 0.2s}
.timg:hover{border-color:var(--primary)}
.tno-img{width:38px;height:38px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;border:2px dashed var(--border);transition:border-color 0.2s}
.tno-img:hover{border-color:var(--primary)}

/* ✅ INLINE PRICE EDIT */
.price-cell{display:flex;align-items:center;gap:6px}
.price-display{font-weight:800;color:var(--primary);cursor:pointer;padding:4px 8px;border-radius:6px;transition:background 0.2s;border:2px solid transparent}
.price-display:hover{background:var(--primary-light);border-color:var(--primary)}
.price-input{width:80px;padding:4px 8px;border:2px solid var(--primary);border-radius:6px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:800;color:var(--primary);outline:none;display:none}
.price-input.show{display:block}
.price-display.hide{display:none}

.btn{padding:7px 14px;border:none;border-radius:8px;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;font-size:12px;display:inline-flex;align-items:center;gap:5px;transition:all 0.2s;white-space:nowrap}
.btn-primary{background:var(--primary);color:white}.btn-primary:hover{background:var(--primary-dark)}
.btn-green{background:var(--green);color:white}
.btn-red{background:var(--red);color:white}
.btn-orange{background:var(--orange);color:white}
.btn-blue{background:var(--blue);color:white}
.btn-ghost{background:transparent;border:2px solid var(--border);color:var(--text)}.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:4px 9px;font-size:11px}
.badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.badge-green{background:#e8f5e9;color:var(--green)}
.badge-red{background:#ffebee;color:var(--red)}
.badge-orange{background:#fff3e0;color:var(--orange)}
.badge-blue{background:#e3f2fd;color:var(--blue)}
.search-input{padding:8px 14px;border:2px solid var(--border);border-radius:8px;font-family:'Cairo',sans-serif;font-size:13px;outline:none;transition:border-color 0.2s}
.search-input:focus{border-color:var(--primary)}
select.search-input{cursor:pointer}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.modal{background:var(--white);border-radius:18px;padding:26px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-hd h3{font-size:17px;font-weight:700}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--gray)}
.fg{margin-bottom:14px}
.fl{display:block;font-size:12px;font-weight:700;margin-bottom:5px}
.fi{width:100%;padding:10px 13px;border:2px solid var(--border);border-radius:9px;font-family:'Cairo',sans-serif;font-size:14px;outline:none;transition:border-color 0.2s}
.fi:focus{border-color:var(--primary)}
select.fi{cursor:pointer}
.upload-zone{border:2px dashed var(--border);border-radius:10px;padding:18px;text-align:center;cursor:pointer;transition:all 0.2s}
.upload-zone:hover{border-color:var(--primary);background:var(--primary-light)}
.upload-zone .uz-icon{font-size:28px;margin-bottom:4px}
.upload-zone p{font-size:12px;color:var(--gray)}
.banner-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.banner-card{background:var(--white);border-radius:14px;overflow:hidden;border:1px solid var(--border);transition:box-shadow 0.2s}
.banner-card:hover{box-shadow:0 4px 20px rgba(209,0,188,0.12)}
.banner-img{width:100%;height:150px;object-fit:cover;background:var(--bg);display:block}
.banner-body{padding:14px}
.banner-title{font-weight:700;margin-bottom:4px;font-size:14px}
.banner-order{font-size:12px;color:var(--gray);margin-bottom:10px}
.banner-actions{display:flex;gap:6px;align-items:center}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.img-card{background:var(--white);border-radius:12px;overflow:hidden;border:2px solid var(--border);transition:border-color 0.2s}
.img-card.done{border-color:var(--green)}
.img-card-pic{width:100%;height:130px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--gray);overflow:hidden}
.img-card-pic img{width:100%;height:100%;object-fit:cover}
.img-card-body{padding:10px}
.img-card-name{font-size:12px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.img-card-sub{font-size:10px;color:var(--gray);margin-bottom:8px}
.subcat-card{background:var(--white);border-radius:12px;border:1px solid var(--border);padding:14px;margin-bottom:10px}
.subcat-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.subcat-name{font-size:14px;font-weight:700;color:var(--text)}
.subcat-meta{font-size:11px;color:var(--gray)}
.subcat-actions{display:flex;gap:6px}
.drag-handle{cursor:grab;color:var(--gray);font-size:18px;padding:0 4px;user-select:none}
.drag-handle:active{cursor:grabbing}
.subcat-card.dragging{opacity:0.4;border:2px dashed var(--primary)}
.subcat-card.drag-over{border-top:3px solid var(--primary)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:white;padding:11px 22px;border-radius:22px;font-size:13px;font-weight:700;opacity:0;transition:opacity 0.3s;z-index:9999;white-space:nowrap}
.toast.show{opacity:1}
.toast.ok{background:var(--green)}
.toast.err{background:var(--red)}
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--gray);flex-direction:column;gap:10px}
.spin{width:36px;height:36px;border:3px solid var(--primary-light);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.progress-bar{background:#eee;border-radius:20px;height:14px;overflow:hidden}
.progress-fill{background:var(--primary);height:100%;border-radius:20px;transition:width 1s}
.order-badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:var(--primary-light);border-radius:8px;font-size:13px;font-weight:900;color:var(--primary-dark)}
.cat-section{margin-bottom:20px}
.cat-header{background:var(--sidebar);color:white;padding:12px 18px;border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.cat-header h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.cat-header .count{background:rgba(255,255,255,0.15);padding:2px 10px;border-radius:20px;font-size:11px}
.cat-header .chev{transition:transform 0.2s;font-size:14px}
.cat-header.open .chev{transform:rotate(180deg)}
.cat-body{border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;overflow:hidden;display:none}
.cat-body.open{display:block}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:14px}
.prod-card{background:var(--bg);border-radius:12px;border:2px solid var(--border);overflow:hidden;transition:all 0.2s;position:relative}
.prod-card:hover{border-color:var(--primary);box-shadow:0 4px 16px rgba(209,0,188,0.12)}
.prod-card-img{width:100%;height:130px;background:var(--white);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;position:relative}
.prod-card-img img{width:100%;height:100%;object-fit:contain}
.prod-card-img .no-img{font-size:36px;color:var(--border)}
.prod-card-img:hover .img-overlay{opacity:1}
.img-overlay{position:absolute;inset:0;background:rgba(209,0,188,0.7);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s;color:white;font-size:24px;cursor:pointer}
.prod-card-body{padding:8px 10px}
.prod-card-name{font-size:12px;font-weight:700;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-card-sub{font-size:10px;color:var(--gray);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-card-footer{display:flex;align-items:center;justify-content:space-between;gap:4px}
.prod-card-acts{display:flex;gap:3px}
/* IMAGE SEARCH OVERLAY */
.img-search-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:2000;display:none;flex-direction:column}
.img-search-overlay.show{display:flex}
.img-search-header{background:var(--sidebar);padding:16px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.img-search-input{flex:1;padding:10px 16px;border:2px solid var(--primary);border-radius:10px;font-family:'Cairo',sans-serif;font-size:14px;outline:none;background:rgba(255,255,255,0.1);color:white}
.img-search-input::placeholder{color:rgba(255,255,255,0.4)}
.img-search-body{flex:1;overflow-y:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.img-result{border-radius:10px;overflow:hidden;cursor:pointer;border:3px solid transparent;transition:all 0.2s;background:#222;aspect-ratio:1}
.img-result:hover{border-color:var(--primary);transform:scale(1.03)}
.img-result img{width:100%;height:100%;object-fit:cover}
@media(max-width:768px){.sidebar{width:60px}.main{margin-right:60px}.nav-item span:not(.ni){display:none}.logo h2,.logo p{display:none}.two-col{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo">
    <div class="logo-icon">✦</div>
    <div><h2>Zura</h2><p>Admin Panel</p></div>
  </div>
  <nav class="nav">
    <div class="nav-section">عام</div>
    <div class="nav-item active" onclick="go('dashboard',this)"><span>📊</span><span>الرئيسية</span></div>
    <div class="nav-section">المحتوى</div>
    <div class="nav-item" onclick="go('products',this)"><span>📦</span><span>المنتجات</span></div>
    <div class="nav-item" onclick="go('subcats',this)"><span>📂</span><span>الأقسام الفرعية</span></div>
    <div class="nav-item" onclick="go('move',this)"><span>🔀</span><span>نقل منتج</span></div>
    <div class="nav-item" onclick="go('images',this)"><span>🖼️</span><span>الصور</span></div>
    <div class="nav-item" onclick="go('categories',this)"><span>🗂️</span><span>الأقسام</span></div>
    <div class="nav-section">التسويق</div>
    <div class="nav-item" onclick="go('banners',this)"><span>🎨</span><span>البنرات الكبيرة</span></div>
    <div class="nav-item" onclick="go('mini_banners',this)"><span>🖼</span><span>البنرات الصغيرة</span></div>
  </nav>
</aside>
<div class="main">
  <div class="topbar">
    <div class="page-title" id="PT">الرئيسية</div>
    <div class="topbar-right" id="TR"></div>
  </div>
  <div class="content" id="PC"><div class="loading"><div class="spin"></div></div></div>
</div>
<!-- IMAGE SEARCH OVERLAY -->
<div class="img-search-overlay" id="ISOV">
  <div class="img-search-header">
    <button onclick="closeImgSearch()" style="background:rgba(255,255,255,0.1);border:none;color:white;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:18px">✕</button>
    <input class="img-search-input" id="imgSearchQ" placeholder="🔍 ابحث عن صورة..." onkeydown="if(event.key==='Enter')searchImages()">
    <button onclick="searchImages()" style="background:var(--primary);border:none;color:white;padding:10px 20px;border-radius:8px;cursor:pointer;font-family:Cairo,sans-serif;font-weight:700;font-size:14px">بحث</button>
    <button onclick="document.getElementById('imgfDirect').click()" style="background:rgba(255,255,255,0.15);border:none;color:white;padding:10px 16px;border-radius:8px;cursor:pointer;font-family:Cairo,sans-serif;font-weight:700;font-size:13px">📤 من الجهاز</button>
    <input type="file" id="imgfDirect" accept="image/*" style="display:none" onchange="uploadFromFile(this)">
  </div>
  <!-- PASTE ZONE -->
  <div id="pasteZone" style="margin:12px 16px 0;border:3px dashed rgba(209,0,188,0.5);border-radius:12px;padding:16px;text-align:center;color:rgba(255,255,255,0.6);font-size:13px;cursor:pointer;transition:all 0.2s;background:rgba(209,0,188,0.05)"
    onclick="this.focus()" tabindex="0"
    onpaste="handlePaste(event)"
    ondragover="event.preventDefault();this.style.borderColor='var(--primary)'"
    ondragleave="this.style.borderColor='rgba(209,0,188,0.5)'"
    ondrop="handleDrop(event)">
    📋 <strong style="color:var(--primary)">Ctrl+V</strong> للزق صورة من الكليبورد — أو اسحب وأفلت صورة هنا
  </div>
  <div class="img-search-body" id="imgSearchBody">
    <div style="color:rgba(255,255,255,0.3);text-align:center;grid-column:1/-1;padding:60px;font-size:16px">ابحث عن صورة أو الزق من الكليبورد 📋</div>
  </div>
</div>

<div class="overlay" id="MOD">
  <div class="modal">
    <div class="modal-hd"><h3 id="MT"></h3><button class="modal-close" onclick="closeM()">✕</button></div>
    <div id="MB"></div>
  </div>
</div>
<div class="toast" id="T"></div>

<script>
const API='https://zad-store-backend-production.up.railway.app';
let prods=[],imgProds=[],cats=[],banners=[],miniBanners=[],sv='',isv='';
let searchTimer=null;

function go(page,el){
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
  const tls={dashboard:'الرئيسية',products:'المنتجات',subcats:'الأقسام الفرعية',move:'نقل منتج',images:'الصور',categories:'الأقسام',banners:'البنرات الكبيرة',mini_banners:'البنرات الصغيرة'};
  document.getElementById('PT').textContent=tls[page]||page;
  const acts={
    products:`<button class="btn btn-primary" onclick="openAdd('product')">➕ منتج جديد</button>`,
    categories:`<button class="btn btn-primary" onclick="openAdd('category')">➕ قسم جديد</button>`,
    banners:`<button class="btn btn-primary" onclick="openAdd('banner')">➕ بنر جديد</button>`,
    mini_banners:`<button class="btn btn-primary" onclick="openAdd('minibanner')">➕ بنر صغير</button>`,
    subcats:`<select class="search-input" id="subcatFilter" onchange="loadSubcats()"><option value="">كل الأقسام</option></select>`,
    images:`<input class="search-input" id="IS" placeholder="🔍 بحث..." oninput="isv=this.value;renderImgs()" style="width:160px">
            <select class="search-input" id="IF" onchange="renderImgs()"><option value="all">الكل</option><option value="no">بدون صورة</option><option value="yes">عندها صورة</option></select>`,
    move:'',dashboard:'',
  };
  document.getElementById('TR').innerHTML=acts[page]||'';
  ({dashboard:loadDash,products:loadProds,subcats:loadSubcats,move:loadMove,images:loadImgs,categories:loadCats,banners:loadBanners,mini_banners:loadMiniBanners})[page]?.();
}

// ── DASHBOARD ──
async function loadDash(){
  setC('<div class="loading"><div class="spin"></div></div>');
  try{
    const [p,b,mb]=await Promise.all([api('/api/products'),api('/api/banners'),apiSafe('/api/banners/mini')]);
    const wi=p.filter(x=>x.image&&x.image!==''&&x.image!=='no_image').length;
    const pct=Math.round(wi/p.length*100)||0;
    setC(`<div class="stats-grid">
      <div class="stat-card"><div class="stat-icon" style="background:var(--primary-light)">📦</div><div class="stat-info"><h3>${p.length}</h3><p>إجمالي المنتجات</p></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#e8f5e9">🖼️</div><div class="stat-info"><h3>${wi}</h3><p>منتجات بصور</p></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#ffebee">⚠️</div><div class="stat-info"><h3>${p.length-wi}</h3><p>بدون صور</p></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#e3f2fd">🎨</div><div class="stat-info"><h3>${b.banners?.length||0}</h3><p>بنرات كبيرة</p></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#fff3e0">🖼</div><div class="stat-info"><h3>${mb?.banners?.length||0}</h3><p>بنرات صغيرة</p></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#f3e5f5">🗂️</div><div class="stat-info"><h3 id="catCount">-</h3><p>الأقسام</p></div></div>
    </div>
    <div class="card" style="padding:20px">
      <h3 style="margin-bottom:12px;font-size:15px">📈 نسبة اكتمال الصور</h3>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <p style="margin-top:8px;font-size:13px;color:var(--gray)">${pct}% مكتمل (${wi} من ${p.length} منتج)</p>
    </div>`);
    api('/api/categories').then(c=>{const el=document.getElementById('catCount');if(el)el.textContent=c.length||0});
  }catch(e){setC('<div class="loading">❌ فشل التحميل</div>')}
}

// ── PRODUCTS - مجمعة بالقسم ──
async function loadProds(){
  setC('<div class="loading"><div class="spin"></div></div>');
  prods=await api('/api/products');
  if(!cats.length) cats=await api('/api/categories');
  sv='';
  renderProds();
}

function renderProds(){
  // جمع المنتجات بالقسم
  const grouped={};
  let filtered=prods;
  if(sv) filtered=prods.filter(p=>p.name?.includes(sv)||p.sub_category?.includes(sv));

  filtered.forEach(p=>{
    const k=p.category_key||'غير محدد';
    if(!grouped[k]) grouped[k]=[];
    grouped[k].push(p);
  });

  const totalFiltered=filtered.length;
  let html=`<div style="display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
    <input class="search-input" placeholder="🔍 بحث في كل المنتجات..." value="${sv}"
      oninput="clearTimeout(searchTimer);searchTimer=setTimeout(()=>{sv=this.value;renderProds();},350)"
      style="width:280px">
    <span style="font-size:13px;color:var(--gray)">${totalFiltered} منتج</span>
    <button class="btn btn-ghost btn-sm" onclick="expandAll()">فتح الكل</button>
    <button class="btn btn-ghost btn-sm" onclick="collapseAll()">إغلاق الكل</button>
  </div>`;

  Object.entries(grouped).forEach(([catKey,catProds])=>{
    const cat=cats.find(c=>c._id===catKey);
    const catName=cat?.name||catKey;
    html+=`
    <div class="cat-section" id="cat-${catKey}">
      <div class="cat-header open" onclick="toggleCat('${catKey}')">
        <h3>🗂️ ${esc(catName)} <span class="count">${catProds.length} منتج</span></h3>
        <span class="chev">▼</span>
      </div>
      <div class="cat-body open" id="catbody-${catKey}">
        <div class="prod-grid">
        ${catProds.map(p=>`
          <div class="prod-card" id="row-${p._id}">
            <div class="prod-card-img" onclick="openImgSearch('${p._id}','${esc(p.name||'')}')">
              ${p.image&&p.image!==''&&p.image!=='no_image'
                ?`<img src="${p.image}" onerror="this.parentElement.innerHTML='<div class=no-img>📷</div>'">`
                :`<div class="no-img">📷</div>`}
              <div class="img-overlay">🔍</div>
            </div>
            <input type="file" id="imgf-${p._id}" accept="image/*" style="display:none" onchange="uploadImgInline(this,'${p._id}')">
            <div class="prod-card-body">
              <div class="prod-card-name" title="${esc(p.name||'')}">${esc(p.name||'-')}</div>
              <div class="prod-card-sub">${esc(p.sub_category||'-')}</div>
              <div class="prod-card-footer">
                <div class="price-cell">
                  <span class="price-display" id="pd-${p._id}" onclick="editPrice('${p._id}')">${p.price||0} ج</span>
                  <input class="price-input" id="pi-${p._id}" type="number" value="${p.price||0}"
                    onkeydown="if(event.key==='Enter')savePrice('${p._id}');if(event.key==='Escape')cancelPrice('${p._id}')"
                    onblur="savePrice('${p._id}')">
                </div>
                <div class="prod-card-acts">
                  <button class="btn btn-orange btn-sm" onclick="editProd('${p._id}')" title="تعديل">✏️</button>
                  <button class="btn btn-blue btn-sm" onclick="openMoveSingle('${p._id}')" title="نقل">🔀</button>
                  <button class="btn btn-red btn-sm" onclick="delProd('${p._id}','${esc(p.name||'')}')">🗑️</button>
                </div>
              </div>
            </div>
          </div>`).join('')}
        </div>
      </div>
    </div>`;
  });

  setC(html||'<div class="loading">لا توجد نتائج</div>');
}

function toggleCat(key){
  const hdr=document.querySelector(`#cat-${key} .cat-header`);
  const body=document.getElementById(`catbody-${key}`);
  if(!hdr||!body)return;
  hdr.classList.toggle('open');
  body.classList.toggle('open');
}
function expandAll(){document.querySelectorAll('.cat-header').forEach(h=>h.classList.add('open'));document.querySelectorAll('.cat-body').forEach(b=>b.classList.add('open'));}
function collapseAll(){document.querySelectorAll('.cat-header').forEach(h=>h.classList.remove('open'));document.querySelectorAll('.cat-body').forEach(b=>b.classList.remove('open'));}

// ✅ INLINE PRICE EDIT
function editPrice(id){
  document.getElementById(`pd-${id}`).classList.add('hide');
  const inp=document.getElementById(`pi-${id}`);
  inp.classList.add('show');
  inp.focus();inp.select();
}
function cancelPrice(id){
  document.getElementById(`pd-${id}`).classList.remove('hide');
  document.getElementById(`pi-${id}`).classList.remove('show');
}
async function savePrice(id){
  const inp=document.getElementById(`pi-${id}`);
  if(!inp||!inp.classList.contains('show'))return;
  const newPrice=+inp.value;
  const p=prods.find(x=>x._id===id);
  if(!p)return;
  if(newPrice===p.price){cancelPrice(id);return;}
  await fetch(`${API}/api/products/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...p,price:newPrice})});
  p.price=newPrice;
  const disp=document.getElementById(`pd-${id}`);
  if(disp)disp.textContent=`${newPrice} ج`;
  cancelPrice(id);
  toast('✅ تم تحديث السعر','ok');
}

// ✅ QUICK IMAGE UPLOAD من الجدول
function quickUploadImg(id){
  document.getElementById(`imgf-${id}`)?.click();
}
async function uploadImgInline(inp,id){
  if(!inp.files[0])return;
  toast('⏳ جاري رفع الصورة...','');
  const fd=new FormData();fd.append('image',inp.files[0]);
  try{
    const d=await fetch(`${API}/api/products/${id}/upload-image`,{method:'POST',body:fd}).then(r=>r.json());
    if(d.image){
      const p=prods.find(x=>x._id===id);if(p)p.image=d.image;
      const row=document.getElementById(`row-${id}`);
      if(row){
        const imgWrap=row.querySelector('td:first-child div');
        if(imgWrap)imgWrap.innerHTML=`<img src="${d.image}" class="timg">`;
      }
      toast('✅ تم رفع الصورة','ok');
    }
  }catch{toast('❌ فشل الرفع','err');}
}

// ── SUBCATS ──
async function loadSubcats(){
  setC('<div class="loading"><div class="spin"></div></div>');
  if(!prods.length) prods=await api('/api/products');
  if(!cats.length) cats=await api('/api/categories');
  const filterEl=document.getElementById('subcatFilter');
  if(filterEl&&filterEl.options.length<=1){
    cats.forEach(c=>{const o=document.createElement('option');o.value=c._id;o.textContent=c.name||c._id;filterEl.appendChild(o);});
  }
  renderSubcats(filterEl?.value||'');
}

function renderSubcats(catFilter){
  const groups={};
  prods.forEach(p=>{
    if(catFilter&&p.category_key!==catFilter)return;
    const k=p.category_key||'غير محدد';
    const s=p.sub_category||'غير محدد';
    if(!groups[k])groups[k]={};
    if(!groups[k][s])groups[k][s]={count:0,order:p.sub_category_order||0};
    groups[k][s].count++;
    if(p.sub_category_order)groups[k][s].order=p.sub_category_order;
  });
  let html='';
  Object.entries(groups).forEach(([catKey,subs])=>{
    const cat=cats.find(c=>c._id===catKey);
    const catName=cat?.name||catKey;
    const sortedSubs=Object.entries(subs).sort((a,b)=>a[1].order-b[1].order);
    html+=`<div class="card" style="margin-bottom:18px">
      <div class="card-header">
        <h3>🗂️ ${esc(catName)} <span style="font-size:12px;color:var(--gray);font-weight:400">(${Object.values(subs).reduce((a,b)=>a+b.count,0)} منتج)</span></h3>
        <button class="btn btn-primary btn-sm" onclick="openAddSubcat('${catKey}','${esc(catName)}')">➕ قسم فرعي جديد</button>
      </div>
      <div style="padding:14px">
        ${sortedSubs.map(([sub,info],idx)=>`
          <div class="subcat-card" draggable="true"
            ondragstart="dragStart(event,'${catKey}','${esc(sub)}')"
            ondragover="dragOver(event)" ondrop="dropOn(event,'${catKey}','${esc(sub)}')"
            ondragleave="dragLeave(event)">
            <div class="subcat-header">
              <div style="display:flex;align-items:center;gap:10px">
                <span class="drag-handle">⠿</span>
                <span class="order-badge">${idx+1}</span>
                <div>
                  <div class="subcat-name">${esc(sub)}</div>
                  <div class="subcat-meta">${info.count} منتج • ترتيب: ${info.order||idx+1}</div>
                </div>
              </div>
              <div class="subcat-actions">
                <button class="btn btn-orange btn-sm" onclick="editSubcat('${catKey}','${esc(sub)}','${esc(catName)}')">✏️ تعديل</button>
                <button class="btn btn-red btn-sm" onclick="deleteSubcat('${catKey}','${esc(sub)}')">🗑️ حذف</button>
              </div>
            </div>
          </div>`).join('')}
      </div>
    </div>`;
  });
  setC(html||'<div class="loading">لا توجد أقسام فرعية</div>');
}

let dragCatKey='',dragSubName='';
function dragStart(e,catKey,sub){dragCatKey=catKey;dragSubName=sub;e.target.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function dragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function dragLeave(e){e.currentTarget.classList.remove('drag-over');}
async function dropOn(e,toCatKey,toSub){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  if(dragCatKey!==toCatKey||dragSubName===toSub)return;
  const fromProds=prods.filter(p=>p.category_key===dragCatKey&&p.sub_category===dragSubName);
  const toProds=prods.filter(p=>p.category_key===toCatKey&&p.sub_category===toSub);
  const fromOrder=fromProds[0]?.sub_category_order||0;
  const toOrder=toProds[0]?.sub_category_order||0;
  toast('⏳ جاري تغيير الترتيب...','');
  const updates=[];
  fromProds.forEach(p=>updates.push(fetch(`${API}/api/products/${p._id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...p,sub_category_order:toOrder})})));
  toProds.forEach(p=>updates.push(fetch(`${API}/api/products/${p._id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...p,sub_category_order:fromOrder})})));
  await Promise.all(updates);
  toast('✅ تم تغيير الترتيب','ok');
  prods=await api('/api/products');
  renderSubcats(document.getElementById('subcatFilter')?.value||'');
}

function openAddSubcat(catKey,catName){
  setM(`➕ إضافة قسم فرعي في ${catName}`,`
    <div class="fg"><label class="fl">اسم القسم الفرعي</label><input class="fi" id="nsN" placeholder="مثال: ألبان"></div>
    <div class="fg"><label class="fl">الترتيب</label><input class="fi" type="number" id="nsO" value="0"></div>
    <button class="btn btn-primary" style="width:100%" onclick="saveNewSubcat('${catKey}')">💾 حفظ</button>`);
}
async function saveNewSubcat(catKey){
  const name=v('nsN');const order=+v('nsO');
  if(!name){toast('أدخل اسم القسم الفرعي','err');return;}
  await fetch(`${API}/api/products`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'منتج مؤقت - يمكن حذفه',price:0,category_key:catKey,sub_category:name,sub_category_order:order,image:'',isActive:false})});
  toast('✅ تم إنشاء القسم الفرعي','ok');closeM();
  prods=await api('/api/products');
  renderSubcats(document.getElementById('subcatFilter')?.value||'');
}
function editSubcat(catKey,oldSub,catName){
  const catProds=prods.filter(p=>p.category_key===catKey&&p.sub_category===oldSub);
  const currentOrder=catProds[0]?.sub_category_order||0;
  setM(`✏️ تعديل: ${oldSub}`,`
    <div class="fg"><label class="fl">الاسم الجديد</label><input class="fi" id="esN" value="${esc(oldSub)}"></div>
    <div class="fg"><label class="fl">الترتيب</label><input class="fi" type="number" id="esO" value="${currentOrder}">
      <p style="font-size:11px;color:var(--gray);margin-top:4px">رقم أصغر = يظهر أولاً</p>
    </div>
    <p style="font-size:12px;color:var(--gray);margin-bottom:14px">سيتم تطبيق التغيير على ${catProds.length} منتج</p>
    <button class="btn btn-primary" style="width:100%" onclick="doEditSubcat('${catKey}','${esc(oldSub)}')">💾 حفظ</button>`);
}
async function doEditSubcat(catKey,oldSub){
  const newName=v('esN');const newOrder=+v('esO');
  const catProds=prods.filter(p=>p.category_key===catKey&&p.sub_category===oldSub);
  toast('⏳ جاري التحديث...','');
  await Promise.all(catProds.map(p=>fetch(`${API}/api/products/${p._id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...p,sub_category:newName,sub_category_order:newOrder})})));
  toast(`✅ تم تحديث ${catProds.length} منتج`,'ok');closeM();
  prods=await api('/api/products');
  renderSubcats(document.getElementById('subcatFilter')?.value||'');
}
async function deleteSubcat(catKey,sub){
  const count=prods.filter(p=>p.category_key===catKey&&p.sub_category===sub).length;
  if(!confirm(`حذف القسم الفرعي "${sub}" و${count} منتج؟`))return;
  const toDelete=prods.filter(p=>p.category_key===catKey&&p.sub_category===sub);
  toast('⏳ جاري الحذف...','');
  await Promise.all(toDelete.map(p=>fetch(`${API}/api/products/${p._id}`,{method:'DELETE'})));
  toast(`🗑️ تم حذف ${toDelete.length} منتج`,'ok');
  prods=await api('/api/products');
  renderSubcats(document.getElementById('subcatFilter')?.value||'');
}

function filterMoveProds(){
  const q=document.getElementById('moveSearch').value.toLowerCase();
  Array.from(document.getElementById('moveProdSel').options).forEach(o=>{o.style.display=o.text.toLowerCase().includes(q)?'':'none';});

function showMoveInfo(){
  const sel=document.getElementById('moveProdSel');
  const opt=sel.options[sel.selectedIndex];
  if(!opt||!opt.value){document.getElementById('moveInfo').style.display='none';return;}
  const p=prods.find(x=>x._id===opt.value);if(!p)return;
  document.getElementById('moveInfo').style.display='block';

  document.getElementById('moveProdCurrent').textContent=`القسم الحالي: ${p.category_key||''} | القسم الفرعي: ${p.sub_category||''}`;

function updateMoveSubOptions(){
  const catKey=document.getElementById('moveNewCat')?.value||'';

  const wrap=document.getElementById('moveSubSuggestions');

  if(subs.length){wrap.style.display='block';list.innerHTML=subs.map(s=>`<span onclick="document.getElementById('moveNewSub').value='${esc(s)}'" style="background:var(--primary-light);color:var(--primary-dark);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer">${esc(s)}</span>`).join('');}

async function loadImgs(){
  setC('<div class="loading"><div class="spin"></div></div>');
  imgProds=await api('/api/products');renderImgs();
}
function renderImgs(){
  const sr=(document.getElementById('IS')?.value||isv).toLowerCase();
  const fl=document.getElementById('IF')?.value||'all';
  let f=imgProds;
  if(fl==='no')f=f.filter(p=>!p.image||p.image===''||p.image==='no_image');
  if(fl==='yes')f=f.filter(p=>p.image&&p.image!==''&&p.image!=='no_image');
  if(sr)f=f.filter(p=>p.name?.toLowerCase().includes(sr)||p.sub_category?.toLowerCase().includes(sr));
  const wi=imgProds.filter(p=>p.image&&p.image!==''&&p.image!=='no_image').length;
  const cards=f.map(p=>`
    <div class="img-card ${p.image&&p.image!==''&&p.image!=='no_image'?'done':''}" id="ic-${p._id}">
      <div class="img-card-pic" id="ip-${p._id}">
        ${p.image&&p.image!==''&&p.image!=='no_image'?`<img src="${p.image}" onerror="this.parentElement.innerHTML='📷'">`:'📷'}
      </div>
      <div class="img-card-body">
        <div class="img-card-name">${esc(p.name||'-')}</div>
        <div class="img-card-sub">${esc(p.sub_category||'')} • ${p.price||0} ج</div>
        <input type="file" accept="image/*" id="if-${p._id}" style="display:none" onchange="uploadImgCard('${p._id}',this)">
        <button class="btn btn-primary btn-sm" style="width:100%" id="ib-${p._id}" onclick="document.getElementById('if-${p._id}').click()">📤 رفع صورة</button>
      </div>
    </div>`).join('');
  setC(`<div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <span class="badge badge-green">✓ ${wi} عندها صورة</span>
      <span class="badge badge-red">✗ ${imgProds.length-wi} بدون صورة</span>
      <span class="badge badge-blue">إجمالي: ${imgProds.length}</span>
    </div>
    <div class="img-grid">${cards||'<div class="loading">لا توجد نتائج</div>'}</div>`);
}
async function uploadImgCard(id,inp){
  const btn=document.getElementById(`ib-${id}`);btn.textContent='⏳...';btn.disabled=true;
  const fd=new FormData();fd.append('image',inp.files[0]);
  try{
    const d=await fetch(`${API}/api/products/${id}/upload-image`,{method:'POST',body:fd}).then(r=>r.json());
    if(d.image){
      const p=imgProds.find(x=>x._id===id);if(p)p.image=d.image;
      document.getElementById(`ip-${id}`).innerHTML=`<img src="${d.image}" style="width:100%;height:100%;object-fit:cover">`;
      document.getElementById(`ic-${id}`).classList.add('done');
      btn.textContent='✅ تم';btn.style.background='var(--green)';toast('✅ تم رفع الصورة','ok');
    }
  }catch{btn.textContent='❌ فشل';btn.disabled=false;toast('❌ فشل الرفع','err');}
}

// ── IMAGE SEARCH ──
let currentImgProdId=null;
function openImgSearch(id,name){
  currentImgProdId=id;
  document.getElementById('ISOV').classList.add('show');
  const q=document.getElementById('imgSearchQ');
  q.value=name||'';
  if(name)searchImages();
  else q.focus();
}
function closeImgSearch(){
  document.getElementById('ISOV').classList.remove('show');
  currentImgProdId=null;
}
async function searchImages(){
  const q=document.getElementById('imgSearchQ').value.trim();
  if(!q)return;
  const body=document.getElementById('imgSearchBody');
  body.innerHTML='<div style="color:rgba(255,255,255,0.4);text-align:center;grid-column:1/-1;padding:40px"><div class="spin" style="margin:0 auto 10px"></div><p>جاري البحث...</p></div>';
  try{
    const r=await fetch(`https://pixabay.com/api/?key=47792990-a88f7c5b0e7b97c6b5b5e5b5b&q=${encodeURIComponent(q)}&image_type=photo&per_page=24`);
    const d=await r.json();
    if(d.hits&&d.hits.length){
      body.innerHTML=d.hits.map(h=>`
        <div class="img-result" onclick="selectImage('${h.webformatURL}')">
          <img src="${h.previewURL}" loading="lazy" onerror="this.parentElement.style.display='none'">
        </div>`).join('');
    } else {
      body.innerHTML=`<div style="color:rgba(255,255,255,0.4);text-align:center;grid-column:1/-1;padding:40px;font-size:14px">لا توجد نتائج — جرب كلمة إنجليزي</div>`;
    }
  }catch{
    body.innerHTML=`<div style="color:rgba(255,255,255,0.4);text-align:center;grid-column:1/-1;padding:40px;font-size:14px">❌ فشل البحث</div>`;
  }
}
async function selectImage(url){
  if(!currentImgProdId)return;
  toast('⏳ جاري رفع الصورة...','');
  try{
    const res=await fetch(url);
    const blob=await res.blob();
    const fd=new FormData();fd.append('image',blob,'image.jpg');
    const d=await fetch(`${API}/api/products/${currentImgProdId}/upload-image`,{method:'POST',body:fd}).then(r=>r.json());
    if(d.image){
      const p=prods.find(x=>x._id===currentImgProdId);if(p)p.image=d.image;
      const card=document.getElementById(`row-${currentImgProdId}`);
      if(card){
        const imgDiv=card.querySelector('.prod-card-img');
        if(imgDiv)imgDiv.innerHTML=`<img src="${d.image}" onerror="this.parentElement.innerHTML='<div class=no-img>📷</div>'"><div class="img-overlay">🔍</div>`;
      }
      toast('✅ تم رفع الصورة','ok');
      closeImgSearch();
    }
  }catch{toast('❌ فشل رفع الصورة','err');}
}
async function uploadFromFile(inp){
  if(!inp.files[0]||!currentImgProdId)return;
  toast('⏳ جاري رفع الصورة...','');
  const fd=new FormData();fd.append('image',inp.files[0]);

    const d=await fetch(`${API}/api/products/${currentImgProdId}/upload-image`,{method:'POST',body:fd}).then(r=>r.json());

  }catch{toast('❌ فشل الرفع','err');}
}

async function handlePaste(e){
  e.preventDefault();
  const items=e.clipboardData?.items;
  if(!items)return;
  for(const item of items){
    if(item.type.startsWith('image/')){
      const blob=item.getAsFile();
      await uploadBlob(blob);
      return;
    }
    if(item.type==='text/plain'){
      item.getAsString(async url=>{
        if(url.startsWith('http')){
          toast('⏳ جاري رفع الصورة من الرابط...','');
          try{
            const res=await fetch(url);
            const blob=await res.blob();
            await uploadBlob(blob);
          }catch{toast('❌ فشل رفع الصورة','err');}
        }
      });
    }
  }
}
async function handleDrop(e){
  e.preventDefault();
  document.getElementById('pasteZone').style.borderColor='rgba(209,0,188,0.5)';
  const files=e.dataTransfer?.files;
  if(files&&files[0]&&files[0].type.startsWith('image/')){
    await uploadBlob(files[0]);
  }
}
async function uploadBlob(blob){
  if(!currentImgProdId||!blob)return;
  toast('⏳ جاري رفع الصورة...','');
  const fd=new FormData();fd.append('image',blob,'image.jpg');
  try{
    const d=await fetch(`${API}/api/products/${currentImgProdId}/upload-image`,{method:'POST',body:fd}).then(r=>r.json());
    if(d.image){
      const p=prods.find(x=>x._id===currentImgProdId);if(p)p.image=d.image;
      const card=document.getElementById(`row-${currentImgProdId}`);
      if(card){
        const imgDiv=card.querySelector('.prod-card-img');
        if(imgDiv)imgDiv.innerHTML=`<img src="${d.image}" onerror="this.parentElement.innerHTML='<div class=no-img>📷</div>'"><div class="img-overlay">🔍</div>`;
      }
      toast('✅ تم رفع الصورة','ok');
      closeImgSearch();
    }
  }catch{toast('❌ فشل الرفع','err');}
}

// global paste listener
document.addEventListener('paste',function(e){
  if(document.getElementById('ISOV').classList.contains('show')&&currentImgProdId){
    handlePaste(e);
  }
});

// ── UTILS ──
function previewImg(inp,targetId){
  const file=inp.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{const el=document.getElementById(targetId);if(el)el.value=e.target.result;};
  reader.readAsDataURL(file);
}
async function api(url){const r=await fetch(API+url);return r.json();}
async function apiSafe(url){try{return await api(url);}catch{return null;}}
function setC(h){document.getElementById('PC').innerHTML=h}
function setM(t,b){document.getElementById('MT').textContent=t;document.getElementById('MB').innerHTML=b;document.getElementById('MOD').classList.add('show')}
function closeM(){document.getElementById('MOD').classList.remove('show')}
function v(id){return document.getElementById(id)?.value||''}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function toast(msg,type){const t=document.getElementById('T');t.textContent=msg;t.className=`toast ${type} show`;setTimeout(()=>t.className='toast',3000)}
document.getElementById('MOD').addEventListener('click',e=>{if(e.target===document.getElementById('MOD'))closeM()});
loadDash();
