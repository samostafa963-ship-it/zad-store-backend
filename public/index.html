<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>زورا - لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#D100BC;--primary-dark:#8a007a;--primary-light:#fce8f9;
  --green:#4caf50;--red:#f44336;--orange:#ff9800;--blue:#2196f3;
  --bg:#f5f0fc;--white:#fff;--text:#2d2d2d;--gray:#888;--border:#edd8f5;
  --sidebar:#0f0a12
}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}

.sidebar{width:240px;background:var(--sidebar);color:white;display:flex;flex-direction:column;position:fixed;height:100vh;z-index:100;overflow:hidden}
.logo{padding:22px 18px;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;gap:12px}
.logo-icon{width:40px;height:40px;background:var(--primary);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.logo h2{font-size:20px;font-weight:900;color:#fff}
.logo p{font-size:10px;color:rgba(255,255,255,0.4)}
.nav{flex:1;padding:12px 0;overflow-y:auto}
.nav-section{font-size:10px;color:rgba(255,255,255,0.3);padding:10px 18px 4px;font-weight:700;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 18px;cursor:pointer;transition:all 0.2s;border-right:3px solid transparent;color:rgba(255,255,255,0.5);font-size:13px;font-weight:600}
.nav-item:hover{background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.85)}
.nav-item.active{background:rgba(209,0,188,0.15);color:var(--primary);border-right-color:var(--primary)}

.main{margin-right:240px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--white);padding:14px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;gap:12px}
.page-title{font-size:19px;font-weight:900}
.topbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.content{padding:22px 28px;flex:1}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.stat-card{background:var(--white);border-radius:14px;padding:18px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 8px rgba(209,0,188,0.06);border:1px solid var(--border)}
.stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.stat-info h3{font-size:22px;font-weight:900;line-height:1}
.stat-info p{font-size:11px;color:var(--gray);margin-top:3px}

.card{background:var(--white);border-radius:14px;box-shadow:0 1px 8px rgba(209,0,188,0.06);border:1px solid var(--border);overflow:hidden}
.card-header{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.card-header h3{font-size:15px;font-weight:700}

table{width:100%;border-collapse:collapse}
th{background:var(--bg);padding:11px 14px;text-align:right;font-size:11px;color:var(--gray);font-weight:700;border-bottom:1px solid var(--border)}
td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fdf5fc}
.timg{width:42px;height:42px;border-radius:8px;object-fit:cover;background:var(--bg)}
.tno-img{width:42px;height:42px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px}

.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:5px;transition:all 0.2s;white-space:nowrap}
.btn-primary{background:var(--primary);color:white}.btn-primary:hover{background:var(--primary-dark)}
.btn-green{background:var(--green);color:white}
.btn-red{background:var(--red);color:white}
.btn-orange{background:var(--orange);color:white}
.btn-blue{background:var(--blue);color:white}
.btn-ghost{background:transparent;border:2px solid var(--border);color:var(--text)}.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:5px 10px;font-size:12px}

.badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.badge-green{background:#e8f5e9;color:var(--green)}
.badge-red{background:#ffebee;color:var(--red)}
.badge-orange{background:#fff3e0;color:var(--orange)}
.badge-blue{background:#e3f2fd;color:var(--blue)}
.badge-primary{background:var(--primary-light);color:var(--primary-dark)}

.search-input{padding:8px 14px;border:2px solid var(--border);border-radius:8px;font-family:'Cairo',sans-serif;font-size:13px;outline:none;transition:border-color 0.2s}
.search-input:focus{border-color:var(--primary)}
select.search-input{cursor:pointer}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.modal{background:var(--white);border-radius:18px;padding:26px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-hd h3{font-size:17px;font-weight:700}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--gray)}

.fg{margin-bottom:14px}
.fl{display:block;font-size:12px;font-weight:700;margin-bottom:5px}
.fi{width:100%;padding:10px 13px;border:2px solid var(--border);border-radius:9px;font-family:'Cairo',sans-serif;font-size:14px;outline:none;transition:border-color 0.2s}
.fi:focus{border-color:var(--primary)}
select.fi{cursor:pointer}
.upload-zone{border:2px dashed var(--border);border-radius:10px;padding:22px;text-align:center;cursor:pointer;transition:all 0.2s}
.upload-zone:hover{border-color:var(--primary);background:var(--primary-light)}
.upload-zone .uz-icon{font-size:30px;margin-bottom:6px}
.upload-zone p{font-size:12px;color:var(--gray)}

.banner-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.banner-card{background:var(--white);border-radius:14px;overflow:hidden;border:1px solid var(--border);transition:box-shadow 0.2s}
.banner-card:hover{box-shadow:0 4px 20px rgba(209,0,188,0.12)}
.banner-img{width:100%;height:150px;object-fit:cover;background:var(--bg);display:block}
.banner-body{padding:14px}
.banner-title{font-weight:700;margin-bottom:4px;font-size:14px}
.banner-order{font-size:12px;color:var(--gray);margin-bottom:10px}
.banner-actions{display:flex;gap:6px;align-items:center}

.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.img-card{background:var(--white);border-radius:12px;overflow:hidden;border:2px solid var(--border);transition:border-color 0.2s}
.img-card.done{border-color:var(--green)}
.img-card-pic{width:100%;height:140px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--gray);overflow:hidden}
.img-card-pic img{width:100%;height:100%;object-fit:cover}
.img-card-body{padding:11px}
.img-card-name{font-size:12px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.img-card-sub{font-size:10px;color:var(--gray);margin-bottom:8px}

/* SUBCATS */
.subcat-card{background:var(--white);border-radius:12px;border:1px solid var(--border);padding:14px;margin-bottom:10px}
.subcat-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.subcat-name{font-size:14px;font-weight:700;color:var(--text)}
.subcat-meta{font-size:11px;color:var(--gray)}
.subcat-actions{display:flex;gap:6px}
.drag-handle{cursor:grab;color:var(--gray);font-size:18px;padding:0 4px;user-select:none}
.drag-handle:active{cursor:grabbing}
.subcat-card.dragging{opacity:0.4;border:2px dashed var(--primary)}
.subcat-card.drag-over{border-top:3px solid var(--primary)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:white;padding:11px 22px;border-radius:22px;font-size:13px;font-weight:700;opacity:0;transition:opacity 0.3s;z-index:9999;white-space:nowrap}
.toast.show{opacity:1}
.toast.ok{background:var(--green)}
.toast.err{background:var(--red)}

.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--gray);flex-direction:column;gap:10px}
.spin{width:36px;height:36px;border:3px solid var(--primary-light);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pagination{display:flex;gap:6px;padding:14px 18px;justify-content:flex-end;flex-wrap:wrap}
.pg-btn{width:32px;height:32px;border:2px solid var(--border);border-radius:7px;background:var(--white);cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;font-size:12px;transition:all 0.2s}
.pg-btn:hover,.pg-btn.on{background:var(--primary);color:white;border-color:var(--primary)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.progress-bar{background:#eee;border-radius:20px;height:14px;overflow:hidden}
.progress-fill{background:var(--primary);height:100%;border-radius:20px;transition:width 1s}

/* ORDER BADGE */
.order-badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:var(--primary-light);border-radius:8px;font-size:13px;font-weight:900;color:var(--primary-dark)}

@media(max-width:768px){.sidebar{width:60px}.main{margin-right:60px}.nav-item span:not(.ni){display:none}.logo h2,.logo p{display:none}.two-col{grid-template-columns:1fr}}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">
    <div class="logo-icon">✦</div>
    <div><h2>Zura</h2><p>Admin Panel</p></div>
  </div>
  <nav class="nav">
    <div class="nav-section">عام</div>
    <div class="nav-item active" onclick="go('dashboard',this)"><span>📊</span><span>الرئيسية</span></div>
    <div class="nav-section">المحتوى</div>
    <div class="nav-item" onclick="go('products',this)"><span>📦</span><span>المنتجات</span></div>
    <div class="nav-item" onclick="go('subcats',this)"><span>📂</span><span>الأقسام الفرعية</span></div>
    <div class="nav-item" onclick="go('move',this)"><span>🔀</span><span>نقل منتج</span></div>
    <div class="nav-item" onclick="go('images',this)"><span>🖼️</span><span>الصور</span></div>
    <div class="nav-item" onclick="go('categories',this)"><span>🗂️</span><span>الأقسام</span></div>
    <div class="nav-section">التسويق</div>
    <div class="nav-item" onclick="go('banners',this)"><span>🎨</span><span>البنرات الكبيرة</span></div>
    <div class="nav-item" onclick="go('mini_banners',this)"><span>🖼</span><span>البنرات الصغيرة</span></div>
  </nav>
</aside>

<div class="main">
  <div class="topbar">
    <div class="page-title" id="PT">الرئيسية</div>
    <div class="topbar-right" id="TR"></div>
  </div>
  <div class="content" id="PC"><div class="loading"><div class="spin"></div></div></div>
</div>

<div class="overlay" id="MOD">
  <div class="modal">
    <div class="modal-hd"><h3 id="MT"></h3><button class="modal-close" onclick="closeM()">✕</button></div>
    <div id="MB"></div>
  </div>
</div>
<div class="toast" id="T"></div>

<script>
const API='https://zad-store-backend-production.up.railway.app';
let prods=[],imgProds=[],cats=[],banners=[],miniBanners=[],pp=1,ipp=1,sv='',isv='';
const PER=25;
let dragSrc=null;

function go(page,el){
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
  const tls={dashboard:'الرئيسية',products:'المنتجات',subcats:'الأقسام الفرعية',move:'نقل منتج',images:'الصور',categories:'الأقسام',banners:'البنرات الكبيرة',mini_banners:'البنرات الصغيرة'};
  document.getElementById('PT').textContent=tls[page]||page;
  const acts={
    products:`<button class="btn btn-primary" onclick="openAdd('product')">➕ منتج جديد</button>`,
    categories:`<button class="btn btn-primary" onclick="openAdd('category')">➕ قسم جديد</button>`,
    banners:`<button class="btn btn-primary" onclick="openAdd('banner')">➕ بنر جديد</button>`,
    mini_banners:`<button class="btn btn-primary" onclick="openAdd('minibanner')">➕ بنر صغير</button>`,
    subcats:`<select class="search-input" id="subcatFilter" onchange="loadSubcats()"><option value="">كل الأقسام</option></select>`,
    images:`<input class="search-input" id="IS" placeholder="🔍 بحث..." oninput="isv=this.value;renderImgs()" style="width:160px">
            <select class="search-input" id="IF" onchange="renderImgs()"><option value="all">الكل</option><option value="no">بدون صورة</option><option value="yes">عندها صورة</option></select>`,
    move:``,dashboard:'',
  };
  document.getElementById('TR').innerHTML=acts[page]||'';
  ({dashboard:loadDash,products:loadProds,subcats:loadSubcats,move:loadMove,images:loadImgs,categories:loadCats,banners:loadBanners,mini_banners:loadMiniBanners})[page]?.();
}

// DASHBOARD
async function loadDash(){
  setC('<div class="loading"><div class="spin"></div></div>');
  try{
    const [p,b,mb]=await Promise.all([api('/api/products'),api('/api/banners'),apiSafe('/api/banners/mini')]);
    const wi=p.filter(x=>x.image&&x.image!==''&&x.image!=='no_image').length;
    const pct=Math.round(wi/p.length*100)||0;
    setC(`
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon" style="background:var(--primary-light)">📦</div><div class="stat-info"><h3>${p.length}</h3><p>إجمالي المنتجات</p></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#e8f5e9">🖼️</div><div class="stat-info"><h3>${wi}</h3><p>منتجات بصور</p></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#ffebee">⚠️</div><div class="stat-info"><h3>${p.length-wi}</h3><p>بدون صور</p></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#e3f2fd">🎨</div><div class="stat-info"><h3>${b.banners?.length||0}</h3><p>بنرات كبيرة</p></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#fff3e0">🖼</div><div class="stat-info"><h3>${mb?.banners?.length||0}</h3><p>بنرات صغيرة</p></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#f3e5f5">🗂️</div><div class="stat-info"><h3 id="catCount">-</h3><p>الأقسام</p></div></div>
    </div>
    <div class="card" style="padding:20px;margin-bottom:16px">
      <h3 style="margin-bottom:12px;font-size:15px">📈 نسبة اكتمال الصور</h3>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <p style="margin-top:8px;font-size:13px;color:var(--gray)">${pct}% مكتمل (${wi} من ${p.length} منتج)</p>
    </div>`);
    api('/api/categories').then(c=>{const el=document.getElementById('catCount');if(el)el.textContent=c.length||0});
  }catch(e){setC('<div class="loading">❌ فشل التحميل</div>')}
}

// PRODUCTS
async function loadProds(){
  setC('<div class="loading"><div class="spin"></div></div>');
  prods=await api('/api/products');pp=1;sv='';renderProds();
}
function renderProds(){
  let f=prods;
  if(sv) f=f.filter(p=>p.name?.includes(sv)||p.sub_category?.includes(sv)||p.category_key?.includes(sv));
  const total=f.length,pages=Math.ceil(total/PER);
  const sl=f.slice((pp-1)*PER,pp*PER);
  const rows=sl.map(p=>`<tr>
    <td>${p.image&&p.image!==''&&p.image!=='no_image'?`<img src="${p.image}" class="timg" onerror="this.style.display='none'">`:`<div class="tno-img">📷</div>`}</td>
    <td><strong>${esc(p.name||'-')}</strong></td>
    <td><span style="font-size:12px;color:var(--gray)">${esc(p.sub_category||'-')}</span></td>
    <td><code style="background:var(--bg);padding:2px 7px;border-radius:5px;font-size:11px">${esc(p.category_key||'-')}</code></td>
    <td><strong style="color:var(--primary)">${p.price||0} ج</strong></td>
    <td><span class="badge ${p.image&&p.image!==''&&p.image!=='no_image'?'badge-green':'badge-red'}">${p.image&&p.image!==''&&p.image!=='no_image'?'✓':'✗'}</span></td>
    <td style="display:flex;gap:5px;flex-wrap:wrap">
      <button class="btn btn-orange btn-sm" onclick="editProd('${p._id}')">✏️</button>
      <button class="btn btn-blue btn-sm" onclick="openMoveSingle('${p._id}')">🔀</button>
      <button class="btn btn-red btn-sm" onclick="delProd('${p._id}','${esc(p.name||'')}')">🗑️</button>
    </td></tr>`).join('');
  const pgs=pages>1?Array.from({length:pages},(_,i)=>`<button class="pg-btn ${i+1===pp?'on':''}" onclick="pp=${i+1};renderProds()">${i+1}</button>`).join(''):'';
  setC(`<div class="card">
    <div class="card-header"><h3>📦 المنتجات (${total})</h3>
      <input class="search-input" placeholder="🔍 بحث..." value="${sv}" oninput="sv=this.value;pp=1;renderProds()" style="width:220px">
    </div>
    <div style="overflow-x:auto"><table><thead><tr><th>صورة</th><th>الاسم</th><th>القسم الفرعي</th><th>القسم</th><th>السعر</th><th>صورة؟</th><th>إجراءات</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${pgs?`<div class="pagination">${pgs}</div>`:''}
  </div>`);
}

// SUBCATS - مع ترتيب بالـ drag & drop
async function loadSubcats(){
  setC('<div class="loading"><div class="spin"></div></div>');
  if(!prods.length) prods=await api('/api/products');
  if(!cats.length) cats=await api('/api/categories');

  // fill filter
  const filterEl=document.getElementById('subcatFilter');
  if(filterEl&&filterEl.options.length<=1){
    cats.forEach(c=>{const o=document.createElement('option');o.value=c._id;o.textContent=c.name||c._id;filterEl.appendChild(o);});
  }
  const selectedCat=filterEl?.value||'';
  renderSubcats(selectedCat);
}

function renderSubcats(catFilter){
  // group by category then sub_category, with order
  const groups={};
  prods.forEach(p=>{
    if(catFilter&&p.category_key!==catFilter) return;
    const k=p.category_key||'غير محدد';
    const s=p.sub_category||'غير محدد';
    if(!groups[k]) groups[k]={};
    if(!groups[k][s]) groups[k][s]={count:0,order:p.sub_category_order||0};
    groups[k][s].count++;
    if(p.sub_category_order) groups[k][s].order=p.sub_category_order;
  });

  let html='';
  Object.entries(groups).forEach(([catKey,subs])=>{
    const cat=cats.find(c=>c._id===catKey);
    const catName=cat?.name||catKey;
    const sortedSubs=Object.entries(subs).sort((a,b)=>a[1].order-b[1].order);
    html+=`
      <div class="card" style="margin-bottom:18px">
        <div class="card-header">
          <h3>🗂️ ${esc(catName)} <span style="font-size:12px;color:var(--gray);font-weight:400">(${Object.values(subs).reduce((a,b)=>a+b.count,0)} منتج)</span></h3>
          <button class="btn btn-primary btn-sm" onclick="openAddSubcat('${catKey}','${esc(catName)}')">➕ قسم فرعي جديد</button>
        </div>
        <div style="padding:14px" id="sublist-${catKey}">
          ${sortedSubs.map(([sub,info],idx)=>`
            <div class="subcat-card" draggable="true"
              ondragstart="dragStart(event,'${catKey}','${esc(sub)}')"
              ondragover="dragOver(event)"
              ondrop="dropOn(event,'${catKey}','${esc(sub)}')"
              ondragleave="dragLeave(event)"
              id="sc-${catKey}-${esc(sub)}">
              <div class="subcat-header">
                <div style="display:flex;align-items:center;gap:10px">
                  <span class="drag-handle" title="اسحب لتغيير الترتيب">⠿</span>
                  <span class="order-badge">${idx+1}</span>
                  <div>
                    <div class="subcat-name">${esc(sub)}</div>
                    <div class="subcat-meta">${info.count} منتج • ترتيب: ${info.order||idx+1}</div>
                  </div>
                </div>
                <div class="subcat-actions">
                  <button class="btn btn-orange btn-sm" onclick="editSubcat('${catKey}','${esc(sub)}','${esc(catName)}')">✏️ تعديل</button>
                  <button class="btn btn-red btn-sm" onclick="deleteSubcat('${catKey}','${esc(sub)}')">🗑️ حذف</button>
                </div>
              </div>
            </div>`).join('')}
        </div>
      </div>`;
  });

  setC(html||'<div class="loading">لا توجد أقسام فرعية</div>');
}

// DRAG & DROP للترتيب
let dragCatKey='',dragSubName='';
function dragStart(e,catKey,sub){
  dragCatKey=catKey;dragSubName=sub;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
}
function dragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function dragLeave(e){e.currentTarget.classList.remove('drag-over');}
async function dropOn(e,toCatKey,toSub){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if(dragCatKey!==toCatKey||dragSubName===toSub) return;

  // get current order of both
  const fromProds=prods.filter(p=>p.category_key===dragCatKey&&p.sub_category===dragSubName);
  const toProds=prods.filter(p=>p.category_key===toCatKey&&p.sub_category===toSub);
  const fromOrder=fromProds[0]?.sub_category_order||0;
  const toOrder=toProds[0]?.sub_category_order||0;

  toast('⏳ جاري تغيير الترتيب...','');
  // swap orders
  const updates=[];
  fromProds.forEach(p=>updates.push(fetch(`${API}/api/products/${p._id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...p,sub_category_order:toOrder})})));
  toProds.forEach(p=>updates.push(fetch(`${API}/api/products/${p._id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...p,sub_category_order:fromOrder})})));
  await Promise.all(updates);
  toast('✅ تم تغيير الترتيب','ok');
  prods=await api('/api/products');
  renderSubcats(document.getElementById('subcatFilter')?.value||'');
}

async function doEditSubcat(catKey,oldSub){

async function deleteSubcat(catKey,sub){
  const count=prods.filter(p=>p.category_key===catKey&&p.sub_category===sub).length;
  if(!confirm(`حذف القسم الفرعي "${sub}" و${count} منتج؟`))return;
  const toDelete=prods.filter(p=>p.category_key===catKey&&p.sub_category===sub);
  toast('⏳ جاري الحذف...','');
  await Promise.all(toDelete.map(p=>fetch(`${API}/api/products/${p._id}`,{method:'DELETE'})));
  toast(`🗑️ تم حذف ${toDelete.length} منتج`,'ok');
  prods=await api('/api/products');
  renderSubcats(document.getElementById('subcatFilter')?.value||'');
}

function filterMoveProds(){
  const q=document.getElementById('moveSearch').value.toLowerCase();
  const sel=document.getElementById('moveProdSel');
  Array.from(sel.options).forEach(o=>{
    o.style.display=o.text.toLowerCase().includes(q)?'':'none';
  });
}

function showMoveInfo(){
  const sel=document.getElementById('moveProdSel');
  const opt=sel.options[sel.selectedIndex];
  if(!opt||!opt.value){document.getElementById('moveInfo').style.display='none';return;}
  const p=prods.find(x=>x._id===opt.value);
  if(!p)return;
  document.getElementById('moveInfo').style.display='block';
  document.getElementById('moveProdName').textContent=p.name||'';
  document.getElementById('moveProdCurrent').textContent=`القسم الحالي: ${p.category_key||''} | القسم الفرعي: ${p.sub_category||''}`;
  // set current values
  const catSel=document.getElementById('moveNewCat');
  if(catSel) catSel.value=p.category_key||catSel.options[0]?.value;
  document.getElementById('moveNewSub').value=p.sub_category||'';
  updateMoveSubOptions();
}

function updateMoveSubOptions(){
  const catKey=document.getElementById('moveNewCat')?.value||'';
  const existingSubs=[...new Set(prods.filter(p=>p.category_key===catKey).map(p=>p.sub_category).filter(Boolean))];
  const wrap=document.getElementById('moveSubSuggestions');
  const list=document.getElementById('moveSubList');
  if(existingSubs.length){
    wrap.style.display='block';
    list.innerHTML=existingSubs.map(s=>`<span onclick="document.getElementById('moveNewSub').value='${esc(s)}'" style="background:var(--primary-light);color:var(--primary-dark);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer">${esc(s)}</span>`).join('');
  } else {wrap.style.display='none';}
}

async function doMove(){
  const id=document.getElementById('moveProdSel')?.value;

  if(!id){toast('اختر منتجاً','err');return;}

  await fetch(`${API}/api/products/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...p,category_key:newCat,sub_category:newSub})});
  toast('✅ تم نقل المنتج','ok');
  prods=await api('/api/products');renderMoveUI();
}

async function loadImgs(){
  setC('<div class="loading"><div class="spin"></div></div>');

function renderImgs(){
  const sr=(document.getElementById('IS')?.value||isv).toLowerCase();
  const fl=document.getElementById('IF')?.value||'all';
  let f=imgProds;
  if(fl==='no') f=f.filter(p=>!p.image||p.image===''||p.image==='no_image');
  if(fl==='yes') f=f.filter(p=>p.image&&p.image!==''&&p.image!=='no_image');
  if(sr) f=f.filter(p=>p.name?.toLowerCase().includes(sr)||p.sub_category?.toLowerCase().includes(sr));
  const wi=imgProds.filter(p=>p.image&&p.image!==''&&p.image!=='no_image').length;
  const cards=f.map(p=>`
    <div class="img-card ${p.image&&p.image!==''&&p.image!=='no_image'?'done':''}" id="ic-${p._id}">
      <div class="img-card-pic" id="ip-${p._id}">
        ${p.image&&p.image!==''&&p.image!=='no_image'?`<img src="${p.image}" onerror="this.parentElement.innerHTML='📷'">`:'📷'}
      </div>
      <div class="img-card-body">
        <div class="img-card-name">${esc(p.name||'-')}</div>
        <div class="img-card-sub">${esc(p.sub_category||'')} • ${p.price||0} ج</div>
        <input type="file" accept="image/*" id="if-${p._id}" style="display:none" onchange="uploadImgCard('${p._id}',this)">
        <button class="btn btn-primary btn-sm" style="width:100%" id="ib-${p._id}" onclick="document.getElementById('if-${p._id}').click()">📤 رفع صورة</button>
      </div>
    </div>`).join('');
  setC(`
    <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <span class="badge badge-green">✓ ${wi} عندها صورة</span>
      <span class="badge badge-red">✗ ${imgProds.length-wi} بدون صورة</span>
      <span class="badge badge-blue">إجمالي: ${imgProds.length}</span>
    </div>
    <div class="img-grid">${cards||'<div class="loading">لا توجد نتائج</div>'}</div>`);
}
async function uploadImgCard(id,inp){
  const btn=document.getElementById(`ib-${id}`);btn.textContent='⏳...';btn.disabled=true;
  const fd=new FormData();fd.append('image',inp.files[0]);
  try{
    const d=await fetch(`${API}/api/products/${id}/upload-image`,{method:'POST',body:fd}).then(r=>r.json());
    if(d.image){
      const p=imgProds.find(x=>x._id===id);if(p)p.image=d.image;
      document.getElementById(`ip-${id}`).innerHTML=`<img src="${d.image}" style="width:100%;height:100%;object-fit:cover">`;
      document.getElementById(`ic-${id}`).classList.add('done');
      btn.textContent='✅ تم';btn.style.background='var(--green)';toast('✅ تم رفع الصورة','ok');
    }
  }catch{btn.textContent='❌ فشل';btn.disabled=false;toast('❌ فشل الرفع','err');}
}

    <td><code style="background:var(--bg);padding:2px 7px;border-radius:5px;font-size:11px">${esc(c._id||'-')}</code></td>
    <td><span class="order-badge">${c.order||0}</span></td>
    <td style="display:flex;gap:5px">
      <button class="btn btn-orange btn-sm" onclick="editCat('${c._id}')">✏️</button>
      <button class="btn btn-red btn-sm" onclick="delCat('${c._id}','${esc(c.name||'')}')">🗑️</button>
    </td></tr>`).join('');
  setC(`<div class="card">
    <div class="card-header"><h3>🗂️ الأقسام (${cats.length})</h3></div>
    <div style="overflow-x:auto"><table><thead><tr><th>صورة</th><th>الاسم</th><th>المفتاح</th><th>الترتيب</th><th>إجراءات</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>`);
}
async function saveCat(){
  await fetch(`${API}/api/categories`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({_id:v('cK'),name:v('cN'),order:+v('cO'),image_url:v('cI')})});
  closeM();toast('✅ تم','ok');cats=await api('/api/categories');renderCatsPage();
}
function editCat(id){
  const c=cats.find(x=>x._id===id);if(!c)return;
  setM('✏️ تعديل قسم',`
    <div class="fg"><label class="fl">اسم القسم</label><input class="fi" id="cN" value="${esc(c.name||'')}"></div>
    <div class="two-col">
      <div class="fg"><label class="fl">الترتيب</label><input class="fi" type="number" id="cO" value="${c.order||0}"></div>
      <div class="fg"><label class="fl">لون الخلفية</label><input class="fi" id="cC" value="${esc(c.color_class||'')}"></div>
    </div>
    <div class="fg"><label class="fl">رابط الصورة</label><input class="fi" id="cI" value="${esc(c.image_url||'')}"></div>
    <div class="fg">
      <label class="fl">أو ارفع صورة</label>
      <div class="upload-zone" onclick="document.getElementById('cF').click()"><div class="uz-icon">📤</div><p>اضغط لرفع صورة</p></div>
      <input type="file" id="cF" accept="image/*" style="display:none" onchange="uploadCatImg(this,'${id}')">
    </div>
    ${c.image_url?`<img src="${c.image_url}" style="width:100%;height:80px;object-fit:contain;border-radius:8px;margin-bottom:10px;background:var(--bg)" onerror="this.style.display='none'">`:''}
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="updateCat('${id}')">💾 حفظ</button>
      <button class="btn btn-red" onclick="delCat('${id}','${esc(c.name||'')}')">🗑️</button>

async function uploadCatImg(inp,id){
  toast('⏳ جاري الرفع...','');
  const fd=new FormData();fd.append('image',inp.files[0]);
  const d=await fetch(`${API}/api/categories/${id}/upload-image`,{method:'POST',body:fd}).then(r=>r.json());
  if(d.image_url){document.getElementById('cI').value=d.image_url;toast('✅ تم','ok');}
}
async function updateCat(id){
  await fetch(`${API}/api/categories/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:v('cN'),order:+v('cO'),color_class:v('cC'),image_url:v('cI')})});
  closeM();toast('✅ تم','ok');cats=await api('/api/categories');renderCatsPage();
}
async function delCat(id,name){
  if(!confirm(`حذف "${name}"؟`))return;
  await fetch(`${API}/api/categories/${id}`,{method:'DELETE'});
  toast('🗑️ تم','ok');cats=await api('/api/categories');renderCatsPage();
}

// BANNERS
function bannerForm(b,action){
  return`<div class="fg"><label class="fl">العنوان</label><input class="fi" id="bT" value="${esc(b.title||'')}"></div>
    <div class="fg"><label class="fl">رابط الصورة</label><input class="fi" id="bI" value="${esc(b.image||'')}"></div>

async function loadBanners(){

}
function renderBannersPage(){
  const cards=banners.map(b=>`
    <div class="banner-card">
      <img src="${b.image}" class="banner-img" onerror="this.style.background='var(--bg)'">
      <div class="banner-body">
        <div class="banner-title">${esc(b.title||'بدون عنوان')}</div>
        <div class="banner-order">ترتيب: ${b.order||0}</div>

          <span class="badge ${b.isActive?'badge-green':'badge-red'}">${b.isActive?'نشط':'معطل'}</span>
          <button class="btn btn-orange btn-sm" style="margin-right:auto" onclick="editBanner('${b._id}')">✏️ تعديل</button>
          <button class="btn btn-red btn-sm" onclick="delBanner('${b._id}')">🗑️</button>

      </div>

async function saveBanner(){
  await fetch(`${API}/api/banners`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:v('bT'),image:v('bI'),order:+v('bO'),isActive:v('bA')==='true'})});
  closeM();toast('✅ تم','ok');const d=await api('/api/banners');banners=d.banners||[];renderBannersPage();

function editBanner(id){
  const b=banners.find(x=>x._id===id);if(!b)return;
  setM('✏️ تعديل بنر',bannerForm(b,`updateBanner('${id}')`));
}
async function uploadBannerImg(inp,id){
  toast('⏳ رفع...','');
  const fd=new FormData();fd.append('image',inp.files[0]);
  const d=await fetch(`${API}/api/banners/${id}/upload-image`,{method:'POST',body:fd}).then(r=>r.json());
  if(d.image){document.getElementById('bI').value=d.image;toast('✅ تم','ok');}
}
async function updateBanner(id){
  await fetch(`${API}/api/banners/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:v('bT'),image:v('bI'),order:+v('bO'),isActive:v('bA')==='true'})});
  closeM();toast('✅ تم','ok');const d=await api('/api/banners');banners=d.banners||[];renderBannersPage();
}
async function delBanner(id){
  if(!confirm('حذف؟'))return;
  await fetch(`${API}/api/banners/${id}`,{method:'DELETE'});
  toast('🗑️ تم','ok');const d=await api('/api/banners');banners=d.banners||[];renderBannersPage();
}

// UTILS
function previewImg(inp,targetId){
  const file=inp.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{const el=document.getElementById(targetId);if(el)el.value=e.target.result;};
  reader.readAsDataURL(file);
}
async function api(url){const r=await fetch(API+url);return r.json();}
async function apiSafe(url){try{return await api(url);}catch{return null;}}
function setC(h){document.getElementById('PC').innerHTML=h}
function setM(t,b){document.getElementById('MT').textContent=t;document.getElementById('MB').innerHTML=b;document.getElementById('MOD').classList.add('show')}
function closeM(){document.getElementById('MOD').classList.remove('show')}
function v(id){return document.getElementById(id)?.value||''}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function toast(msg,type){const t=document.getElementById('T');t.textContent=msg;t.className=`toast ${type} show`;setTimeout(()=>t.className='toast',3000)}
document.getElementById('MOD').addEventListener('click',e=>{if(e.target===document.getElementById('MOD'))closeM()});
loadDash();
</script>
